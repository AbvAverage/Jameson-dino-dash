[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pages always fetch fresh so updates show up right away.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/play/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Landing page code and art: cache, but check back for changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short links to the game.
[[redirects]]
  from = "/game"
  to = "/play/"
  status = 301
